version: "0.1.0"
description: "Kode Dot SDK: the screen calls of kode.h"
url: "https://docs.kode.diy/sdk/kode"
repository: "https://github.com/kodediy/kode-sdk.git"
repository_info:
  path: "components/kode_screen"
license: "GPL-3.0-or-later"
targets:
  - esp32p4

## kode_screen is optional, like kscreen: an app that draws names it, and it
## brings kscreen, kui and LVGL with it. kodediy/kode does not name it. The
## siblings arrive at the same release (see khal's manifest for the mechanism).
dependencies:
  idf: ">=6.1"
  kodediy/kode:    {version: "==0.1.0", override_path: "../kode"}
  kodediy/kscreen: {version: "==0.1.0", override_path: "../kscreen"}
  kodediy/kui:     {version: "==0.1.0", override_path: "../kui"}
  kodediy/kbsp:    {version: "==0.1.0", override_path: "../kbsp"}
  kodediy/kdrv:    {version: "==0.1.0", override_path: "../kdrv"}
  kodediy/khal:    {version: "==0.1.0", override_path: "../khal"}
  kodediy/klog:    {version: "==0.1.0", override_path: "../klog"}
  kodediy/kqp:     {version: "==0.1.0", override_path: "../kqp"}
